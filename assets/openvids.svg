<text class="sans" x="40" y="156" font-size="17" fill="#ebecef">An open-source desktop video editor you work in together with AI agents,</text>
<text class="sans" x="40" y="182" font-size="17" fill="#9a9ca3">running locally on projects that are just folders of plain files.</text>
<rect x="40" y="218" width="6" height="6" rx="1.5" fill="#F48D3C"/><text class="sans" x="58" y="226" font-size="14.5" fill="#ebecef"><tspan font-weight="600">Edit by chat</tspan><tspan fill="#9a9ca3"> · Director + specialist agents</tspan></text><rect x="440" y="218" width="6" height="6" rx="1.5" fill="#F48D3C"/><text class="sans" x="458" y="226" font-size="14.5" fill="#ebecef"><tspan font-weight="600">Local analysis</tspan><tspan fill="#9a9ca3"> · transcripts and retakes</tspan></text><rect x="40" y="246" width="6" height="6" rx="1.5" fill="#F48D3C"/><text class="sans" x="58" y="254" font-size="14.5" fill="#ebecef"><tspan font-weight="600">Story mode</tspan><tspan fill="#9a9ca3"> · video as a graph of sections</tspan></text><rect x="440" y="246" width="6" height="6" rx="1.5" fill="#F48D3C"/><text class="sans" x="458" y="254" font-size="14.5" fill="#ebecef"><tspan font-weight="600">Render QA</tspan><tspan fill="#9a9ca3"> · agents check and fix</tspan></text>
