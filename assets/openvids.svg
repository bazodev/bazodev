<svg xmlns="http://www.w3.org/2000/svg" width="840" height="364" viewBox="0 0 840 364" role="img" aria-labelledby="t d">
<title id="t">OpenVids</title>
<desc id="d">OpenVids is an open-source desktop video editor for macOS that you work in together with AI agents. Apache-2.0, TypeScript, Apple Silicon.</desc>
